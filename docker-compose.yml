services:
  app:
    build:
      context: ./src
      args:
        GOARCH: arm64 # native on Apple Silicon; use amd64 on Intel/AMD machines
    environment:
      ENABLE_DEBUG: "1" # local only: enables /debug/panic so a 500 can be demoed
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "50m" # cap log size so a load test can't fill your disk
        max-file: "3"
    cpus: 0.25 # optional: match the Fargate task size to see saturation locally

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    depends_on:
      - prometheus
